
name: purohitset_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_animate: ^4.5.1
  animate_text: ^1.0.0
  get_storage: ^2.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  multi_dropdown: ^3.2.2
  circle_nav_bar: ^2.2.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - Assets/Images/
    - Assets/Gif/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Assets/Images/purohit-setu-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true